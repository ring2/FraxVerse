# =============================================================================
# FraxVerse 碎片宇宙量化系统 · 全栈 Docker Compose
#
# 一键启动：docker compose up -d
# 访问前端：http://localhost
# 访问后端：http://localhost:8000/docs
# =============================================================================

name: fraxverse

services:
  # ── 数据库 ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fraxverse-db
    environment:
      POSTGRES_DB: fraxverse
      POSTGRES_USER: fraxverse
      POSTGRES_PASSWORD: fraxverse_dev
      TZ: Asia/Shanghai
    volumes:
      - fraxverse-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraxverse -d fraxverse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fraxverse-net

  # ── 缓存 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fraxverse-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - fraxverse-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fraxverse-net

  # ── 后端 API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraxverse-api
    environment:
      DATABASE_URL: "postgresql+asyncpg://fraxverse:fraxverse_dev@postgres:5432/fraxverse"
      SYNC_DATABASE_URL: "postgresql://fraxverse:fraxverse_dev@postgres:5432/fraxverse"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev-secret-key-change-in-production}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEBUG: "true"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - fraxverse-net

  # ── 调度器（新闻采集 + 止损监视 + 数据质量 + 开盘复核）───────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraxverse-scheduler
    environment:
      DATABASE_URL: "postgresql+asyncpg://fraxverse:fraxverse_dev@postgres:5432/fraxverse"
      SYNC_DATABASE_URL: "postgresql://fraxverse:fraxverse_dev@postgres:5432/fraxverse"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev-secret-key-change-in-production}"
      TZ: Asia/Shanghai
    command: ["python", "-m", "src.cron_scheduler", "--mode", "all"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fraxverse-net

  # ── 前端 SPA ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraxverse-web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - fraxverse-net

volumes:
  fraxverse-pgdata:
  fraxverse-redis-data:

networks:
  fraxverse-net:
    driver: bridge
