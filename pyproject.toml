[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PL"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "E501", "E701", "E702", "PLR0913", "PLC0415"]
"src/strategy/scorer.py" = ["PLR2004", "SIM108", "PLR0912", "PLR0915", "E501", "ARG001"]
"src/strategy/state_machine.py" = ["PLR0913", "PLR0912", "ARG001", "ARG002"]
"src/engine/backtesting.py" = ["PLR0913", "E501", "SIM102"]
"src/strategy/backtest_runner.py" = ["PLR0913", "ARG001"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: 单元测试", "integration: 集成测试", "backtest: 策略回测", "slow: 耗时测试 > 30秒", "regression: 回归测试"]
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]
[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError", "pass"]
