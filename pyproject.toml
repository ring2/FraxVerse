[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PL"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: 单元测试", "integration: 集成测试", "backtest: 策略回测", "slow: 耗时测试 > 30秒", "regression: 回归测试"]
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]
[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError", "pass"]
